<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Pro - Cyber System</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 127, 0.08), transparent 25%);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
        }

        /* Hiệu ứng lưới nền */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        .app-container {
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 243, 255, 0.05);
            position: relative;
        }

        /* Viền phát sáng */
        .app-container::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            background: linear-gradient(45deg, #00f3ff, transparent, #ff007f, transparent);
            z-index: -1;
            border-radius: 13px;
            animation: borderGlow 4s linear infinite;
            opacity: 0.5;
        }

        @keyframes borderGlow {
            0% { filter: blur(5px); }
            50% { filter: blur(10px); }
            100% { filter: blur(5px); }
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            color: #00f3ff;
            font-size: 22px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
        }

        .free-key-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #fff;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .turn-badge {
            background: rgba(0, 243, 255, 0.1);
            color: #00f3ff;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 243, 255, 0.5);
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .category { 
            font-size: 12px; 
            color: #888; 
            margin-bottom: 10px; 
            margin-top: 20px; 
            letter-spacing: 1px;
        }

        /* Card ứng dụng */
        .app-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .app-box::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.5s;
        }

        .app-box:hover::after { left: 100%; }
        .app-box:hover { border-color: rgba(0, 243, 255, 0.5); box-shadow: 0 0 15px rgba(0, 243, 255, 0.1); }

        .app-info { display: flex; align-items: center; gap: 12px; }
        .app-icon {
            width: 40px; height: 40px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid #00f3ff;
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }
        .app-name { font-family: 'Orbitron', sans-serif; font-size: 14px; color: #fff; }

        .btn-get {
            background: transparent;
            color: #00f3ff;
            border: 1px solid #00f3ff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn-get:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        }

        /* Phần Key của tôi */
        .my-key-header {
            display: flex; justify-content: space-between; align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px; margin-top: 25px; margin-bottom: 12px;
            color: #00f3ff;
        }
        .view-all { color: #ff007f; font-size: 11px; cursor: pointer; text-decoration: underline; }
        .view-all:hover { text-shadow: 0 0 10px #ff007f; }
        
        .key-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px dashed #00f3ff;
            border-radius: 8px;
            padding: 15px;
            display: none;
            animation: fadeIn 0.5s ease;
            position: relative;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .key-name { font-family: 'Orbitron', sans-serif; font-size: 13px; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .key-code {
            background: #000;
            border: 1px solid rgba(0, 243, 255, 0.5);
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            letter-spacing: 3px;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            cursor: pointer;
            user-select: all;
            transition: all 0.3s;
        }
        .key-code:hover { background: rgba(0, 243, 255, 0.1); }
        .key-time { font-size: 11px; color: #666; margin-top: 10px; text-align: right; }

        /* Danh sách xem tất cả */
        .all-keys-list {
            display: none;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .key-item {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px; margin-bottom: 10px;
        }
        .key-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        /* Thanh cuộn */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="app-container">
        <div class="header">
            <h1>KEY PRO SYSTEM</h1>
        </div>

        <div class="free-key-title">
            <span>🎁 NHẬN KEY MIỄN PHÍ</span>
            <span class="turn-badge">LƯỢT: 2/2</span>
        </div>

        <div class="category">📦 TELEGRAM PLATFORM</div>
        
        <div class="app-box">
            <div class="app-info">
                <div class="app-icon">🔥</div>
                <div class="app-name">KEY VIP</div>
            </div>
            <button class="btn-get" onclick="getKey('Skibidi (2h)', 'VIP')">🚀 LẤY</button>
        </div>
        
        <div class="app-box">
            <div class="app-info">
                <div class="app-icon">👑</div>
                <div class="app-name">SUPER VIP</div>
            </div>
            <button class="btn-get" onclick="getKey('Skibidi (4h)', 'SVIP')">🚀 LẤY</button>
        </div>

        <div class="my-key-header">
            <span>🔑 DỮ LIỆU KEY CỦA BẠN</span>
            <span class="view-all" onclick="toggleViewAll()">[ XEM TẤT CẢ ]</span>
        </div>
        
        <div class="key-box" id="latestKeyBox">
            <div class="key-name">
                <span id="displayKeyName">Chưa có dữ liệu</span>
                <span style="color:#ff007f; font-size:10px; border: 1px solid #ff007f; padding: 2px 5px; border-radius: 3px;">KEY TẶNG</span>
            </div>
            <div class="key-code" id="displayKeyCode" onclick="copyKey()">BẤM LẤY KEY</div>
            <div class="key-time" id="displayKeyTime">---</div>
        </div>

        <div class="all-keys-list" id="allKeysList">
            <!-- Chèn bằng JS -->
        </div>

    </div>

    <script>
        function getMyKeys() {
            let keys = localStorage.getItem('my_keys_list');
            return keys ? JSON.parse(keys) : [];
        }

        function saveMyKeys(keys) {
            localStorage.setItem('my_keys_list', JSON.stringify(keys));
        }

        function getKey(duration, type) {
            let keyCode = type + "-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            let now = new Date();
            let timeString = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0') + " " + now.getDate().toString().padStart(2, '0') + "/" + (now.getMonth()+1).toString().padStart(2, '0') + "/" + now.getFullYear();
            
            let newKey = { name: duration, code: keyCode, time: timeString };
            let myKeys = getMyKeys();
            myKeys.push(newKey);
            saveMyKeys(myKeys);

            updateUI();
        }

        function updateUI() {
            let myKeys = getMyKeys();
            let latestBox = document.getElementById('latestKeyBox');
            
            if (myKeys.length > 0) {
                let latest = myKeys[myKeys.length - 1];
                document.getElementById('displayKeyName').innerText = latest.name;
                document.getElementById('displayKeyCode').innerText = latest.code;
                document.getElementById('displayKeyTime').innerText = "Lấy lúc: " + latest.time;
                latestBox.style.display = "block";
            } else {
                latestBox.style.display = "none";
            }

            let listContainer = document.getElementById('allKeysList');
            listContainer.innerHTML = "";
            
            if (myKeys.length === 0) {
                listContainer.innerHTML = "<p style='color:#666; text-align:center;'>Hệ thống chưa ghi nhận key nào.</p>";
            } else {
                let reversedKeys = [...myKeys].reverse();
                reversedKeys.forEach((k) => {
                    let div = document.createElement('div');
                    div.className = 'key-item';
                    div.innerHTML = `
                        <div style="font-family:'Orbitron'; font-size:12px; color:#fff; margin-bottom:5px;">${k.name}</div>
                        <div style="font-family:'Share Tech Mono'; color:#00f3ff; font-size:14px; margin-bottom:5px;">${k.code}</div>
                        <div style="font-size:10px; color:#666;">${k.time}</div>
                    `;
                    listContainer.appendChild(div);
                });
            }
        }

        function toggleViewAll() {
            let list = document.getElementById('allKeysList');
            list.style.display = (list.style.display === "block") ? "none" : "block";
        }

        function copyKey() {
            let code = document.getElementById('displayKeyCode').innerText;
            if (code !== "BẤM LẤY KEY") {
                navigator.clipboard.writeText(code).then(() => {
                    // Hiệu ứng thông báo nhỏ
                    let btn = document.getElementById('displayKeyCode');
                    let oldText = btn.innerText;
                    btn.innerText = "✅ ĐÃ COPY!";
                    btn.style.color = "#00ff88";
                    btn.style.borderColor = "#00ff88";
                    setTimeout(() => {
                        btn.innerText = oldText;
                        btn.style.color = "#00f3ff";
                        btn.style.borderColor = "rgba(0, 243, 255, 0.5)";
                    }, 1500);
                });
            }
        }

        window.onload = updateUI;
    </script>
</body>
</html>
