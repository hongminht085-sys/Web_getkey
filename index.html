<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #1e232d;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            background-color: #2b313b;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .free-key-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .turn-badge {
            background-color: #1e232d;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: #00d2ff;
            border: 1px solid #00d2ff;
        }
        .category { font-size: 12px; color: #888; margin-bottom: 10px; margin-top: 20px;}
        .app-box {
            background-color: #353b47;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .app-info { display: flex; align-items: center; gap: 10px; }
        .app-icon {
            width: 40px; height: 40px;
            background-color: #1e232d;
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px;
        }
        .app-name { font-weight: bold; font-size: 15px; }
        .btn-get {
            background-color: #2a4052;
            color: #00d2ff;
            border: 1px solid #00d2ff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-get:hover { background-color: #00d2ff; color: #1e232d; }
        
        /* Phần Key của tôi */
        .my-key-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; font-weight: bold; margin-top: 20px; margin-bottom: 10px;
        }
        .view-all { color: #00d2ff; font-size: 12px; cursor: pointer; }
        .key-box {
            background-color: #1e232d;
            border-radius: 10px;
            padding: 15px;
            border: 1px dashed #444;
            display: none;
        }
        .key-name { font-size: 14px; font-weight: bold; color: #fff; display: flex; justify-content: space-between;}
        .key-code {
            background-color: #353b47;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            font-family: monospace;
            font-size: 16px;
            letter-spacing: 2px;
            color: #00d2ff;
            user-select: all;
        }
        .key-time { font-size: 12px; color: #888; }

        /* Danh sách xem tất cả */
        .all-keys-list {
            display: none;
            margin-top: 15px;
            background-color: #1e232d;
            border-radius: 10px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .key-item {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .key-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Tiêu đề -->
        <div class="header">
            <h1>📱 Key Pro</h1>
        </div>

        <!-- Nhận key -->
        <div class="free-key-title">
            <span>🎁 Nhận miễn phí key vip</span>
            <span class="turn-badge">Lượt hôm nay: 2/2</span>
        </div>

        <!-- Danh mục -->
        <div class="category">📦 TELEGRAM</div>
        <div class="app-box">
            <div class="app-info">
                <div class="app-icon">🔥</div>
                <div class="app-name">Keyvip (Skibidi 2h)</div>
            </div>
            <button class="btn-get" onclick="getKey('Skibidi (2h)', 'VIP')">🚀 Lấy Key</button>
        </div>
        <div class="app-box">
            <div class="app-info">
                <div class="app-icon">👑</div>
                <div class="app-name">Super Vip (Skibidi 4h)</div>
            </div>
            <button class="btn-get" onclick="getKey('Skibidi (4h)', 'SVIP')">🚀 Lấy Key</button>
        </div>

        <!-- Key của tôi -->
        <div class="my-key-header">
            <span>🔑 KEY CỦA TÔI</span>
            <span class="view-all" onclick="toggleViewAll()">👁 Xem tất cả</span>
        </div>
        
        <div class="key-box" id="latestKeyBox">
            <div class="key-name">
                <span id="displayKeyName">Chưa có key</span>
                <span style="color:#888; font-size:12px;">Key tặng</span>
            </div>
            <div class="key-code" id="displayKeyCode" onclick="copyKey()">Bấm lấy key ở trên</div>
            <div class="key-time" id="displayKeyTime">---</div>
        </div>

        <!-- Danh sách tất cả key -->
        <div class="all-keys-list" id="allKeysList">
            <!-- Các key sẽ được chèn vào đây bằng JS -->
        </div>

    </div>

    <script>
        // Lấy danh sách key từ bộ nhớ trình duyệt
        function getMyKeys() {
            let keys = localStorage.getItem('my_keys_list');
            return keys ? JSON.parse(keys) : [];
        }

        // Lưu key
        function saveMyKeys(keys) {
            localStorage.setItem('my_keys_list', JSON.stringify(keys));
        }

        // Lấy key mới
        function getKey(duration, type) {
            let keyCode = type + "-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            let now = new Date();
            let timeString = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0') + " " + now.getDate().toString().padStart(2, '0') + "/" + (now.getMonth()+1).toString().padStart(2, '0') + "/" + now.getFullYear();
            
            let newKey = { name: duration, code: keyCode, time: timeString };

            // Lưu vào danh sách
            let myKeys = getMyKeys();
            myKeys.push(newKey);
            saveMyKeys(myKeys);

            // Cập nhật giao diện
            updateUI();
            alert("Đã tạo key mới! Hãy xem ở phần 'Key Của Tôi'.");
        }

        // Cập nhật giao diện
        function updateUI() {
            let myKeys = getMyKeys();
            let latestBox = document.getElementById('latestKeyBox');
            
            if (myKeys.length > 0) {
                let latest = myKeys[myKeys.length - 1];
                document.getElementById('displayKeyName').innerText = latest.name;
                document.getElementById('displayKeyCode').innerText = latest.code;
                document.getElementById('displayKeyTime').innerText = "Được tặng: " + latest.time;
                latestBox.style.display = "block";
            } else {
                latestBox.style.display = "none";
            }

            // Cập nhật danh sách xem tất cả
            let listContainer = document.getElementById('allKeysList');
            listContainer.innerHTML = "";
            
            if (myKeys.length === 0) {
                listContainer.innerHTML = "<p style='color:#888; text-align:center;'>Chưa có key nào.</p>";
            } else {
                let reversedKeys = [...myKeys].reverse();
                reversedKeys.forEach((k) => {
                    let div = document.createElement('div');
                    div.className = 'key-item';
                    div.innerHTML = `
                        <div style="font-weight:bold; font-size:13px; margin-bottom:5px;">${k.name}</div>
                        <div style="font-family:monospace; color:#00d2ff; margin-bottom:5px;">${k.code}</div>
                        <div style="font-size:11px; color:#888;">Lấy lúc: ${k.time}</div>
                    `;
                    listContainer.appendChild(div);
                });
            }
        }

        // Ẩn/hiện danh sách tất cả
        function toggleViewAll() {
            let list = document.getElementById('allKeysList');
            list.style.display = (list.style.display === "block") ? "none" : "block";
        }

        // Copy key
        function copyKey() {
            let code = document.getElementById('displayKeyCode').innerText;
            if (code !== "Bấm lấy key ở trên") {
                navigator.clipboard.writeText(code).then(() => {
                    alert("Đã sao chép key: " + code);
                });
            }
        }

        // Chạy hàm updateUI khi tải trang
        window.onload = updateUI;
    </script>
</body>
</html>
