<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key VIP - Nhận Thành Công</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.1), transparent 50%);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .box {
            background: rgba(10, 15, 25, 0.9);
            border: 2px solid #00f3ff;
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }
        h2 { font-family: 'Orbitron', sans-serif; color: #00f3ff; font-size: 18px; margin-bottom: 10px; }
        p { color: #aaa; font-size: 13px; margin-bottom: 20px; }
        .key-display {
            background: #000;
            border: 1px dashed #00f3ff;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 15px;
            user-select: all;
            cursor: pointer;
            word-break: break-all;
        }
        .copy-btn {
            background: transparent;
            color: #00f3ff;
            border: 1px solid #00f3ff;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>✅ VƯỢT LINK THÀNH CÔNG!</h2>
        <p>Đây là Key VIP của bạn (Có hiệu lực trong hôm nay):</p>
        <div class="key-display" id="keyDisplay">ĐANG TẠO...</div>
        <button class="copy-btn" onclick="copyKey()">📋 SAO CHÉP KEY</button>
    </div>
    <script>
        // Hàm tạo Key siêu khó ngẫu nhiên
        function generateHardKey(prefix) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let result = prefix + "-";
            for (let i = 0; i < 16; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Hàm băm ngày tháng để tạo seed (hạt giống) cố định cho mỗi ngày
        function getDailySeed() {
            let today = new Date();
            let vnTime = new Date(today.getTime() + (7 * 60 * 60 * 1000));
            let dateString = vnTime.toISOString().slice(0, 10); // YYYY-MM-DD
            let hash = 0;
            for (let i = 0; i < dateString.length; i++) {
                hash = dateString.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash);
        }

        window.onload = function() {
            let seed = getDailySeed();
            // Tạo 5 key VIP khác nhau dựa trên ngày
            let vipKeysToday = [];
            for (let i = 0; i < 5; i++) {
                // Sử dụng seed + i để tạo key cố định cho ngày hôm đó
                let fakeRandom = (seed + i * 1000) % 9999999; 
                let keyStr = "VIP-";
                let tempSeed = fakeRandom;
                for(let j=0; j<16; j++) {
                    let charCode = (tempSeed * (j + 1)) % 62;
                    let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
                    keyStr += chars[charCode];
                    tempSeed += 12345; // Thay đổi seed để ký tự tiếp theo khác đi
                }
                vipKeysToday.push(keyStr);
            }

            // Hiển thị 1 trong 5 key (chọn ngẫu nhiên trên máy người dùng)
            let randomIndex = Math.floor(Math.random() * vipKeysToday.length);
            document.getElementById('keyDisplay').innerText = vipKeysToday[randomIndex];
        };

        function copyKey() {
            let code = document.getElementById('keyDisplay').innerText;
            navigator.clipboard.writeText(code).then(() => {
                let display = document.getElementById('keyDisplay');
                display.innerText = "✅ ĐÃ COPY!";
                display.style.color = "#00ff88";
                setTimeout(() => {
                    display.innerText = code;
                    display.style.color = "#fff";
                }, 1500);
            });
        }
    </script>
</body>
</html>
